name: Pactra checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pactra
          POSTGRES_PASSWORD: pactra
          POSTGRES_DB: pactra_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pactra" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pactra:pactra@localhost:5432/pactra_test
      TEST_DATABASE_URL: postgresql://pactra:pactra@localhost:5432/pactra_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
