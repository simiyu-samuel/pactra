# Card-free hackathon deployment. One free instance runs web + worker.
# Render may sleep/restart this instance; jobs resume from PostgreSQL.
# The free database expires after 30 days. Export data before expiry.
# Add hosted PAYPAL_WEBHOOK_ID and optional discovery keys after provisioning.
previews:
  generation: 'off'
services:
- type: web
  name: pactra-web
  runtime: node
  plan: free
  region: frankfurt
  branch: main
  autoDeployTrigger: 'off'
  buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false &&
    pnpm db:generate && pnpm build
  startCommand: pnpm db:migrate && node --import tsx scripts/bootstrap-staging.ts && node scripts/start-free-service.mjs
  healthCheckPath: /api/health
  envVars:
  - fromGroup: pactra-runtime
  - key: DATABASE_URL
    fromDatabase:
      name: pactra-db
      property: connectionString
  - key: PUBLIC_APP_URL
    fromService:
      type: web
      name: pactra-web
      envVarKey: RENDER_EXTERNAL_URL
  - key: OWNER_LOGIN_SECRET
    generateValue: true
  - key: NEGOTIATIONS_PER_BROWSER_PER_DAY
    value: '3'
  - key: PACTRA_CATALOG_JSON
    sync: false
  - key: GROQ_API_KEY
    sync: false
  - key: PAYPAL_CLIENT_ID
    sync: false
  - key: PAYPAL_CLIENT_SECRET
    sync: false
  - key: PAYPAL_EXPECTED_MERCHANT_ID
    sync: false
  - key: CHANNEL3_API_KEY
    sync: false
  - key: DUFFEL_ACCESS_TOKEN
    sync: false
databases:
- name: pactra-db
  plan: free
  region: frankfurt
  databaseName: pactra
  user: pactra
  ipAllowList: []
envVarGroups:
- name: pactra-runtime
  envVars:
  - key: NODE_VERSION
    value: '22'
  - key: NODE_ENV
    value: production
  - key: GROQ_MODEL
    value: openai/gpt-oss-20b
  - key: GROQ_TOKENS_PER_MINUTE
    value: '6800'
  - key: GROQ_TOKENS_PER_DAY
    value: '170000'
  - key: GROQ_REQUESTS_PER_MINUTE
    value: '25'
  - key: GROQ_REQUESTS_PER_DAY
    value: '850'
  - key: PAYPAL_ENV
    value: sandbox
